[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-sumo"
version = "0.1.0"
description = "A 1v1 2D physics-driven hover arena duel MARL framework with CPU-optimized NumPy physics, GA, and PPO self-play."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kinetic Sumo Team" }
]
dependencies = [
    "numpy>=1.22.0",
    "gymnasium>=1.0.0",
    "pettingzoo>=1.24.0",
    "torch>=2.0.0",
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
